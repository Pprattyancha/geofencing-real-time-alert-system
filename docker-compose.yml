services:
  postgres:
    image: postgres:16-alpine
    container_name: geofencing-postgres
    environment:
      POSTGRES_DB: geofencing
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d geofencing"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: geofencing-api
    environment:
      PORT: 8080
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/geofencing?sslmode=disable
      ALLOWED_ORIGIN: http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
